<svg viewBox="0 0 1280 640" width="1280" height="640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">Cross-Border E-Commerce AI Knowledge Base — social preview</title>
  <style>
    text{font-family:"Inter",-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif}
