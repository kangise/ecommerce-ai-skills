[book]
title = "跨境电商 AI 实战知识库"
authors = ["kangise"]
description = "跨境电商 AI 实战知识库 — 69 章三语指南、878 条声明数据前提的 Prompt、MCP 服务器与带人工审批的 Agent Runtime。CC0。"
language = "zh"
src = "src"

[build]
build-dir = "docs"

[output.html]
default-theme = "light"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/kangise/ecommerce-ai-skills"
edit-url-template = "https://github.com/kangise/ecommerce-ai-skills/edit/main/src/{path}"
no-section-label = false
additional-css = ["custom.css"]
additional-js = ["mermaid.min.js", "mermaid-init.js", "lang-switcher.js"]

[output.html.fold]
enable = true
level = 1
