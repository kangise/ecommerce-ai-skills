[book]
title = "AI × Cross-Border E-Commerce Knowledge Hub"
authors = ["kangise"]
description = "Cross-border e-commerce AI knowledge base — 69 chapters in three languages, 878 prompts that declare their data requirements, an MCP server, and an agent runtime with human approval. CC0."
language = "en"
src = "src"

[build]
build-dir = "book"

[output.html]
default-theme = "light"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/kangise/ecommerce-ai-skills"
edit-url-template = "https://github.com/kangise/ecommerce-ai-skills/edit/main/i18n/en/src/{path}"
no-section-label = false
additional-css = ["custom.css"]
additional-js = ["mermaid.min.js", "mermaid-init.js", "lang-switcher.js"]

[output.html.fold]
enable = true
level = 1
